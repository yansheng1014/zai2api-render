# Render Blueprint — Z.AI2API (zai2api) — 免费档配置
# 一键部署: https://render.com/deploy?repo=https://github.com/yansheng1014/zai2api-render
#
# 说明:
#   - runtime: docker  → 直接用仓库里的 Dockerfile 构建
#   - plan: free        → $0/月,512MB RAM / 0.1 CPU,无需信用卡
#                         750 免费实例小时/月(够 1 个服务 7×24 常驻)
#   - 无 disk           → 免费档不支持持久化磁盘!
#                         每次「重新部署 / 重启 / 休眠唤醒」都会丢失 /app/data,
#                         即 gateway.json(号池)、tokens.sqlite(令牌库)、mihomo 状态会清空,
#                         需要重新配置账号。
#   - 保活              → 已配合 .github/workflows/keep-alive.yml 每 10 分钟 ping,
#                         避免 15 分钟无流量自动休眠(部署后把服务 URL 填进 GitHub secret RENDER_URL)
#   - PORT=8088         → 与 Dockerfile EXPOSE / .env 一致,Render 据此转发流量
#   - AUTH_TOKEN        → 客户端调 API 的 Bearer Token,部署时在 Render 后台填写
#   - ZAI_TOKEN         → 可选,Z.AI 的 JWT(不填则仅 glm-4.7 可用,游客模式)

services:
  - type: web
    name: zai2api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8088"
      - key: HOST
        value: 0.0.0.0
      - key: TZ
        value: Asia/Shanghai
      - key: AUTH_TOKEN
        sync: false
      - key: ZAI_TOKEN
        sync: false
      - key: ZAI_TOKENS
        sync: false
